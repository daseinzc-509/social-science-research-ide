[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sociology-research-agent"
version = "0.1.0"
description = "A local, evidence-first research workflow for social science papers."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7,<3",
    "PyMuPDF>=1.24,<2",
]

[project.scripts]
sra = "sociology_research.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
