[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sociology-research-agent"
version = "0.1.0"
description = "A local, evidence-first research workflow for social science papers."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7,<3",
    # Match the native desktop Release workflow. PDF parsing is Docling-only.
    "docling==2.134.0",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "python-multipart>=0.0.9,<1",
    "httpx>=0.27,<1",
]
dev = [
    "pytest>=8,<10",
]

[project.scripts]
sra = "sociology_research.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
